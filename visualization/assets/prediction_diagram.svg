<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">What the model predicts</title>
  <desc id="desc">A changed source file is scored by the TGN. Predicted-impacted files are true positives or false positives. Predicted-not-impacted files are false negatives or true negatives.</desc>
  <rect width="1080" height="560" fill="#f8fafc"/>
  <text x="540" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f4e79">What the model predicts</text>
  <text x="540" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5d6d7e">Given a changed source file, the TGN scores every other file for likely co-change</text>

  <!-- Input -->
  <rect x="40" y="210" width="200" height="150" rx="16" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="140" y="242" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d6d7e">INPUT</text>
  <rect x="92" y="256" width="96" height="56" rx="8" fill="#1f4e79"/>
  <text x="140" y="280" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#d6e0ea">FILE</text>
  <text x="140" y="300" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="700" fill="#ffffff">A.py</text>
  <text x="140" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f4e79">Changed source file</text>

  <!-- Arrow input to model -->
  <line x1="250" y1="285" x2="318" y2="285" stroke="#1f4e79" stroke-width="3"/>
  <polygon points="328,285 314,278 314,292" fill="#1f4e79"/>

  <!-- Model -->
  <rect x="332" y="210" width="200" height="150" rx="16" fill="#eef1f4" stroke="#5d6d7e" stroke-width="2"/>
  <text x="432" y="242" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5d6d7e">MODEL</text>
  <circle cx="392" cy="292" r="14" fill="none" stroke="#1f4e79" stroke-width="2"/>
  <circle cx="432" cy="278" r="14" fill="none" stroke="#1f4e79" stroke-width="2"/>
  <circle cx="472" cy="292" r="14" fill="none" stroke="#1f4e79" stroke-width="2"/>
  <line x1="404" y1="286" x2="420" y2="282" stroke="#1f4e79" stroke-width="1.5"/>
  <line x1="444" y1="282" x2="460" y2="286" stroke="#1f4e79" stroke-width="1.5"/>
  <line x1="404" y1="298" x2="460" y2="298" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="432" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f4e79">TGN scores other files</text>

  <!-- Arrow model to outcomes -->
  <line x1="542" y1="285" x2="618" y2="285" stroke="#1f4e79" stroke-width="3"/>
  <polygon points="628,285 614,278 614,292" fill="#1f4e79"/>

  <!-- Outcome column headers -->
  <text x="748" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f4e79">Predicted impacted</text>
  <text x="968" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f4e79">Predicted not impacted</text>

  <!-- TP -->
  <rect x="648" y="124" width="200" height="150" rx="14" fill="#e8f8f0" stroke="#1e8449" stroke-width="2"/>
  <text x="748" y="152" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="700" fill="#1e8449">B.py</text>
  <rect x="698" y="166" width="100" height="24" rx="12" fill="#1e8449"/>
  <text x="748" y="183" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">TP</text>
  <text x="748" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#145a32">Actually in the change set</text>
  <text x="748" y="242" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#145a32">Correct warning</text>

  <!-- FN -->
  <rect x="868" y="124" width="200" height="150" rx="14" fill="#fdedec" stroke="#c0392b" stroke-width="2"/>
  <text x="968" y="152" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="700" fill="#c0392b">C.py</text>
  <rect x="918" y="166" width="100" height="24" rx="12" fill="#c0392b"/>
  <text x="968" y="183" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">FN</text>
  <text x="968" y="218" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#922b21">Actually in the change set</text>
  <text x="968" y="242" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#922b21">Missed impact</text>

  <!-- FP -->
  <rect x="648" y="300" width="200" height="150" rx="14" fill="#fef9e7" stroke="#d68910" stroke-width="2"/>
  <text x="748" y="328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="700" fill="#b9770e">D.py</text>
  <rect x="698" y="342" width="100" height="24" rx="12" fill="#d68910"/>
  <text x="748" y="359" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">FP</text>
  <text x="748" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#7d6608">Not in the change set</text>
  <text x="748" y="418" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7d6608">False alarm</text>

  <!-- TN -->
  <rect x="868" y="300" width="200" height="150" rx="14" fill="#eaf2f8" stroke="#5d6d7e" stroke-width="2"/>
  <text x="968" y="328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="700" fill="#2c3e50">E.py</text>
  <rect x="918" y="342" width="100" height="24" rx="12" fill="#5d6d7e"/>
  <text x="968" y="359" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">TN</text>
  <text x="968" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2c3e50">Not in the change set</text>
  <text x="968" y="418" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2c3e50">Correctly left alone</text>

  <!-- Row labels -->
  <text x="628" y="200" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6d7e">Actually</text>
  <text x="628" y="214" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6d7e">changed</text>
  <text x="628" y="376" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6d7e">Not</text>
  <text x="628" y="390" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6d7e">changed</text>

  <text x="540" y="532" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5d6d7e">Each other file falls into exactly one of these four outcomes</text>
</svg>
